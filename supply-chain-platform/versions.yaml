# Single source of truth for every pinned version used by the platform.
#
# Why this file exists: build tools, scanners and platform services are supply-chain
# dependencies too. Pinning them in one place (by digest where practical) means an
# upstream tag being moved or replaced cannot silently change what the platform runs.
# The automation reads this file and passes the values to Docker Compose, kind, Helm
# and the CI runner configuration, so no other file hard-codes its own version.
#
# Updating a version: change it here, run `sscp verify` and the affected test suites.
schemaVersion: 1

tools:
  # kind is downloaded into .tools/bin by `sscp up --with cluster` on first use and is
  # accepted only if it matches the SHA-256 recorded here. The other entries are the
  # versions `sscp doctor` expects on the workstation or bakes into CI images.
  kind:
    version: v0.33.0
    url: https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-windows-amd64
    sha256: 4b22adaa135368c5a465d56bbd8e520cbea87272a06ca00b6078e7b81515c9fc
  kubectlMinor: "1.36"
  helmMajor: "4"
  pythonMinimum: "3.12"
  dotnetSdk: "10.0.401"
  # SonarScanner for .NET, installed into the platform-built `sonar-dotnet` analysis image.
  sonarScannerDotnet: "11.3.0"

kubernetes:
  nodeImage: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed

# Helm charts installed into the kind cluster by the bootstrap.
charts:
  argocd:
    repository: https://argoproj.github.io/argo-helm
    chart: argo-cd
    version: 10.9.2
  kyverno:
    repository: https://kyverno.github.io/kyverno/
    chart: kyverno
    version: 3.9.1
  externalSecrets:
    repository: https://charts.external-secrets.io
    chart: external-secrets
    version: 2.11.0
  trivyOperator:
    repository: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    version: 0.36.0

images:
