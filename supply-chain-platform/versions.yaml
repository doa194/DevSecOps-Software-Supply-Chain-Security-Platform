  # Small utility images used by probes and validation pods
  alpine: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
  busybox: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e

# Images the CI zones run. `sscp up --with ci` copies the linux/amd64 manifest of each one
# (by digest) into Harbor's `platform-tools` project, so pipelines pull only from the
# platform's own registry and never from the internet.
ciMirror:
  - dotnetSdk
  - dotnetAspnet
  - python
  - gitleaks
  - semgrep
  - checkov
  - hadolint
  - syft
  - grype
  - trivy
  - zap
  - cosign
  - oras
  - crane
  - dockerCli
  - dockerfileFrontend
  - alpine
  # Data services of the security-test environment (dynamic testing in the security zone)
  - postgres
  - redis
  - rabbitmq
  - minio
  # Observability stack in the cluster (manifests in cluster/platform/observability)
  - prometheus
  - grafana
  - loki
  - otelCollector
