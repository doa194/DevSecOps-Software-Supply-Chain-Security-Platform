# External Secrets Operator: copies runtime secrets from Vault into Kubernetes Secrets.
#
# It is the only component allowed to write Secrets in the application namespaces
# (enforced by the `restrict-secret-writers` policy). Which Vault paths it may read is
# decided by Vault, per namespace, through the `vault-secrets` service account's role.
installCRDs: true
replicaCount: 1
# Keeps memory small on a workstation; the operator handles a few dozen secrets.
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 192Mi }
webhook:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
serviceMonitor:
  enabled: false
# Sync success and errors per ExternalSecret, scraped by Prometheus.
metrics:
  service:
    enabled: true
