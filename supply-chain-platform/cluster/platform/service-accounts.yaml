# One service account per workload, owned by the platform. None is bound to any Role, and
# pods do not mount their tokens (automountServiceAccountToken: false), so application
# code has no Kubernetes API access at all.
#
# `vault-secrets` in each namespace is the identity External Secrets presents to Vault for
# that namespace. Pods may not run as it (policy `workload-security`).
---
apiVersion: v1
kind: List
items:
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: commerce-api, namespace: commerce } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: commerce-gateway, namespace: commerce } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: audit-worker, namespace: commerce } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: reporting-worker, namespace: commerce } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: notification-worker, namespace: commerce } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: document-worker, namespace: commerce } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: commerce-migrations, namespace: commerce } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: postgres, namespace: commerce-data } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: redis, namespace: commerce-data } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: rabbitmq, namespace: commerce-data } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: minio, namespace: commerce-data } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: vault-secrets, namespace: commerce } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: vault-secrets, namespace: commerce-data } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: vault-secrets, namespace: argocd } }
  - { apiVersion: v1, kind: ServiceAccount, automountServiceAccountToken: false, metadata: { name: vault-secrets, namespace: kyverno } }
