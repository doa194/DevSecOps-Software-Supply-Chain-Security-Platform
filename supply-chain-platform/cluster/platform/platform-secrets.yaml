# Secrets of the platform add-ons, delivered from Vault like every other secret.
---
# Argo CD reads both platform repositories with the read-only `sscp-argocd` Gitea account.
# One credential template covers every repository under the `platform` organisation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-platform-repositories
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: gitea-platform-repositories
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://gitea.sscp.test:3000/platform/
        username: "{{ .username }}"
        password: "{{ .token }}"
  dataFrom:
    - extract:
        key: platform/cluster/argocd/repositories
---
# Bearer token Argo CD's notifications controller sends with deployment reports to the
# Security Control Plane (the Control Plane holds the same value).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: controlplane-token
      remoteRef:
        key: platform/cluster/argocd/notifications
        property: controlplane-token
---
# Kyverno reads signatures and attestations of trusted images with the pull-only robot.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: kyverno
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: harbor-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ .registry }}":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: platform/cluster/harbor-pull
