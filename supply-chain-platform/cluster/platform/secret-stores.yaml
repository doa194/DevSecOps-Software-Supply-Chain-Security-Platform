# Where External Secrets reads from: Vault, one store per namespace.
#
# Each store logs in to Vault with a short-lived token of its namespace's `vault-secrets`
# service account (audience `vault.sscp.test`). Vault checks the token's signature with the
# cluster's service-account key and maps the account to a role that can read only that
# namespace's paths:
#   commerce       kv/workload/commerce/*, kv/platform/cluster/harbor-pull
#   commerce-data  kv/workload/commerce-data/*
#   argocd         kv/platform/cluster/argocd/*
#   kyverno        kv/platform/cluster/harbor-pull
# The namespace is therefore the secret boundary: a GitOps change cannot read another
# namespace's secrets, whatever its ExternalSecrets ask for.
---
apiVersion: v1
kind: List
items:
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    metadata: { name: vault, namespace: commerce }
    spec:
      provider:
        vault:
          server: https://vault.sscp.test:8200
          path: kv
          version: v2
          caProvider: { type: ConfigMap, name: sscp-root-ca, key: ca.crt }
          auth:
            jwt:
              path: jwt-kind
              role: eso-commerce
              kubernetesServiceAccountToken:
                serviceAccountRef: { name: vault-secrets }
                audiences: [vault.sscp.test]
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    metadata: { name: vault, namespace: commerce-data }
    spec:
      provider:
        vault:
          server: https://vault.sscp.test:8200
          path: kv
          version: v2
          caProvider: { type: ConfigMap, name: sscp-root-ca, key: ca.crt }
          auth:
            jwt:
              path: jwt-kind
              role: eso-commerce-data
              kubernetesServiceAccountToken:
                serviceAccountRef: { name: vault-secrets }
                audiences: [vault.sscp.test]
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    metadata: { name: vault, namespace: argocd }
    spec:
      provider:
        vault:
          server: https://vault.sscp.test:8200
          path: kv
          version: v2
          caProvider: { type: ConfigMap, name: sscp-root-ca, key: ca.crt }
          auth:
            jwt:
              path: jwt-kind
              role: eso-argocd
              kubernetesServiceAccountToken:
                serviceAccountRef: { name: vault-secrets }
                audiences: [vault.sscp.test]
  - apiVersion: external-secrets.io/v1
    kind: SecretStore
    metadata: { name: vault, namespace: kyverno }
    spec:
      provider:
        vault:
          server: https://vault.sscp.test:8200
          path: kv
          version: v2
          caProvider: { type: ConfigMap, name: sscp-root-ca, key: ca.crt }
          auth:
            jwt:
              path: jwt-kind
              role: eso-kyverno
              kubernetesServiceAccountToken:
                serviceAccountRef: { name: vault-secrets }
                audiences: [vault.sscp.test]
