# Secrets in the application namespaces come only from Vault, through External Secrets.
#
# Nobody else may create or change a Secret there: not a GitOps change applied by Argo CD,
# not a person with kubectl. This keeps plaintext secrets out of Git and makes Vault the
# single source of every runtime secret. Kubernetes' own controllers may still delete
# Secrets when their owner or namespace is removed.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-secret-writers
  annotations:
    policies.kyverno.io/title: Secrets only from External Secrets
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  # Decided by who makes the request, which only exists at admission.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: In, values: [commerce, commerce-data] }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  validations:
    - expression: >-
        request.userInfo.username == "system:serviceaccount:external-secrets:external-secrets"
        || (request.operation == "DELETE" && request.userInfo.username in [
              "system:serviceaccount:kube-system:generic-garbage-collector",
              "system:serviceaccount:kube-system:namespace-controller"])
      messageExpression: '"Secrets in this namespace are managed by External Secrets from Vault; " + request.userInfo.username + " may not change them"'
