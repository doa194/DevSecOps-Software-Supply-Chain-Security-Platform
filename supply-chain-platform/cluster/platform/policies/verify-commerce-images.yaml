# Admission check of every commerce image: it must be signed with the release key and
# carry signed attestations that show how it was built and that it was approved.
#
# The check runs when a Pod (or a Deployment, StatefulSet or Job, through autogen) is
# created or changed in the `commerce` namespace, independently of CI and of Argo CD: a
# manually pushed, re-tagged or unapproved image is refused even if someone manages to put
# it into the trusted project or the GitOps repository.
#
# The release key's public half is read from the `cosign-commerce` ConfigMap in the
# `kyverno` namespace, which the bootstrap writes from Vault (the key is created per
# installation). Signatures are offline Sigstore bundles, so the transparency-log checks
# are switched off; the signature itself is always verified against the key.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-commerce-images
  annotations:
    policies.kyverno.io/title: Only signed, approved commerce images
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  webhookConfiguration:
    timeoutSeconds: 30
  # Registry lookups happen at admission only; reports are produced for admission results.
  evaluation:
    background:
      enabled: false
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, jobs]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: commerce
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "harbor.sscp.test:8443/commerce-trusted/*"
  validationConfigurations:
    required: true
    verifyDigest: true
    mutateDigest: false
  credentials:
    secrets: [harbor-pull]
  variables:
    - name: keys
      expression: resource.Get("v1", "configmaps", "kyverno", "cosign-commerce")
    # Init containers too: the migrations Job runs each service's image as one.
    # Ephemeral debug containers are refused outright (no-ephemeral-containers.yaml).
    - name: images
      expression: images.containers + images.initContainers
    - name: builder
      expression: '"https://gitea.sscp.test:3000/platform/supply-chain-platform/.gitea/workflows/main-pipeline.yaml@refs/heads/main"'
  attestors:
    - name: release
      cosign:
        key:
          expression: variables.keys.data["key.pem"]
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
    - name: trustDecision
      intoto:
        type: https://sscp.test/attestations/trust-decision/v1
    - name: sbom
      intoto:
        type: https://cyclonedx.org/bom
  validations:
    - expression: variables.images.map(image, verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
      message: image is not signed with the commerce release key
    - expression: >-
        variables.images.map(image, verifyAttestationSignatures(image, attestations.trustDecision, [attestors.release])).all(e, e > 0)
        && variables.images.map(image, extractPayload(image, attestations.trustDecision).predicate.decision.outcome in ["PASS", "PASS_WITH_EXCEPTION"]).all(e, e)
      message: image has no signed, positive trust decision from the Security Control Plane
    - expression: >-
        variables.images.map(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.release])).all(e, e > 0)
        && variables.images.map(image, extractPayload(image, attestations.provenance).predicate.runDetails.builder.id == variables.builder).all(e, e)
      message: image has no signed provenance from the platform's main pipeline
    - expression: variables.images.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.release])).all(e, e > 0)
      message: image has no signed SBOM
