# Secrets of the observability stack, from Vault through External Secrets (the namespace's
# Vault role reads only kv/platform/cluster/observability/*).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: observability
spec:
  provider:
    vault:
      server: https://vault.sscp.test:8200
      path: kv
      version: v2
      caProvider: { type: ConfigMap, name: sscp-root-ca, key: ca.crt }
      auth:
        jwt:
          path: jwt-kind
          role: eso-observability
          kubernetesServiceAccountToken:
            serviceAccountRef: { name: vault-secrets }
            audiences: [vault.sscp.test]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef: { key: platform/cluster/observability/grafana, property: admin-password }
---
# Gitea serves its metrics only with this token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-metrics
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: gitea-metrics
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: platform/cluster/observability/gitea-metrics, property: token }
