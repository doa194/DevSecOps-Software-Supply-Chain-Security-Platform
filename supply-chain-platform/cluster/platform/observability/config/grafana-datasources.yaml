# Grafana data sources: Prometheus (metrics) and Loki (logs), read-only.
# Packed into the `grafana-provisioning` ConfigMap by ../../kustomization.yaml; a change here restarts the pod.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.observability.svc.cluster.local:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.observability.svc.cluster.local:3100
    editable: false
