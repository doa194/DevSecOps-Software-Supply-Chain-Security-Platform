# Prometheus: metrics of the workload, the cluster's security components and the software
# factory, and the alert rules that turn them into signals (alerts.yaml).
#
# In the cluster it scrapes the OpenTelemetry Collector (workload), Kyverno (admission),
# Argo CD (sync and health), External Secrets (secret delivery) and the Trivy Operator
# (running images and objects). Over the `sscp-edge` Docker network it scrapes the
# Security Control Plane's management port, Harbor, Vault and Gitea, so supply-chain
# signals and platform health sit next to runtime signals. The UI is published on
# 127.0.0.1:9990 of this workstation.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: observability
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: observability
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: harbor.sscp.test:8443/platform-tools/prometheus@sha256:86b17a25c2db1d16a61b16b3c8f336679eb19e26333d03e808da387206e40faa
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - { name: http, containerPort: 9090 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 30
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: gitea-metrics, mountPath: /etc/prometheus/secrets, readOnly: true }
            - { name: sscp-root-ca, mountPath: /etc/sscp, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: rules
          configMap:
            name: prometheus-rules
        - name: gitea-metrics
          secret:
            secretName: gitea-metrics
        - name: sscp-root-ca
          configMap:
            name: sscp-root-ca
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - { name: http, port: 9090, targetPort: http, nodePort: 30990 }
