# Grafana: the dashboards people look at (dashboards/*.json, provisioned read-only).
#
# Datasources and dashboards are provisioned from ConfigMaps, so what Grafana shows is
# defined in Git like everything else. The administrator password comes from Vault through
# External Secrets. The UI is published on 127.0.0.1:3300 of this workstation.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: observability
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: harbor.sscp.test:8443/platform-tools/grafana@sha256:4da2af58130e6f1a35fd38615899508bd8ed5d0838f75787883d8cadcc8cbf2b
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-password }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
            - { name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning }
            - { name: GF_PATHS_DATA, value: /var/lib/grafana/data }
            - { name: GF_PATHS_LOGS, value: /var/lib/grafana/logs }
            - { name: GF_PATHS_PLUGINS, value: /var/lib/grafana/plugins }
          ports:
            - { name: http, containerPort: 3000 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 512Mi }   # includes the in-memory database volume
          # Grafana creates its database schema on every start (several hundred steps);
          # liveness checks begin only after that has finished, however long it takes.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
            - { name: state, mountPath: /var/lib/grafana/data }
            - { name: logs, mountPath: /var/lib/grafana/logs }
            - { name: plugins, mountPath: /var/lib/grafana/plugins }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
        # Grafana's own database only holds sessions and preferences; everything shown is
        # provisioned, so an empty volume on restart loses nothing. It is kept in memory:
        # on a disk-backed volume every schema step waits for a disk flush, which on a
        # slow disk stretches startup to several minutes.
        - { name: state, emptyDir: { medium: Memory, sizeLimit: 128Mi } }
        - { name: logs, emptyDir: {} }
        - { name: plugins, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - { name: http, port: 3000, targetPort: http, nodePort: 30300 }
