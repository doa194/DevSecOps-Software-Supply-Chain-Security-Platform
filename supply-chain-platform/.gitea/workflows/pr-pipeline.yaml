# Pull-request source security pipeline.
#
# Platform-owned and started only by the Security Control Plane (workflow_dispatch) when a
# pull request against main is opened or updated in an application repository. It runs in
# the security zone, scans exactly the pull request's head commit and hands the raw
# reports to the Control Plane, which decides and sets the required `sscp/source-security`
# status on the pull request. Nothing here can mark a pull request as passing by itself.
name: pr-pipeline

on:
  workflow_dispatch:
    inputs:
      build_id: { description: Control Plane build id, required: true }
      application: { description: Registered application, required: true }
      repository: { description: Source repository (owner/name), required: true }
      commit: { description: Pull request head commit, required: true }
      pull_request: { description: Pull request number, required: true }

jobs:
  source-security:
    runs-on: sscp-security
    timeout-minutes: 30
    env:
      BUILD_ID: ${{ inputs.build_id }}
      REPOSITORY: ${{ inputs.repository }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Fetch the pull request commit
        run: sscp-ci fetch-source --repository "$REPOSITORY" --commit "$COMMIT" --dest src

      # Each scanner runs in its own pinned container without network access and submits
      # its raw report, also when the scanner itself fails (fail closed at the gate).
      - name: Secrets (Gitleaks)
        run: sscp-ci scan secrets --build "$BUILD_ID" --commit "$COMMIT"

      - name: Static analysis (Semgrep, platform rules)
        run: sscp-ci scan sast --build "$BUILD_ID" --commit "$COMMIT"

      - name: Infrastructure as code (Checkov)
        run: sscp-ci scan iac --build "$BUILD_ID" --commit "$COMMIT"

      - name: Dockerfile (Hadolint)
        run: sscp-ci scan dockerfile --build "$BUILD_ID" --commit "$COMMIT"

      - name: Source security decision (Control Plane)
        id: decision
        run: sscp-ci evaluate-source --build "$BUILD_ID"

      # The build succeeded when the decision could be made, whatever the decision was: a
      # FAIL keeps its own reason in the commit status instead of "pipeline failed".
      - name: Mark the build finished
        if: always()
        run: sscp-ci complete --build "$BUILD_ID" --status "${{ (steps.decision.outcome == 'success' || steps.decision.outcome == 'failure') && 'success' || 'failure' }}"
