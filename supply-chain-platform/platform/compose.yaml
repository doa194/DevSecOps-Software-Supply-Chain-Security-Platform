# Software factory services on Docker Compose.
#
# Why this file exists: the platform services must be running before a cluster exists and
# must survive a cluster reset, so they run here rather than in kind.
#
# How it is used: never run `docker compose` against this file by hand; `sscp up` generates
# .local/generated/compose.env (pinned images from versions.yaml plus generated credentials)
# and passes it with --env-file. Harbor comes from a separate generated Compose file.
#
# Networks (created by the automation, so a cluster attached to them survives `sscp down`):
#   sscp-edge  services that CI runners and the cluster may call, with fixed addresses
#   sscp-data  internal network for databases and raw evidence storage; runners and cluster
#              nodes are not attached, and nothing on it can be reached from outside it
#
# Profiles keep memory use reasonable: core services always run; `quality` (SonarQube),
# `workload` (local development data services), `ci` and `controlplane` start on demand.

name: sscp

x-tls-ca: &tls-ca
  type: bind
  source: ${PKI_DIR}/ca.crt
  target: /etc/sscp/certs/sscp-root-ca.crt
  read_only: true

networks:
  edge:
    name: sscp-edge
    external: true
  data:
    name: sscp-data
    external: true
  workload:
    name: sscp-workload-dev
    external: true

volumes:
  postgres-data:
  vault-data:
  vault-logs:
  minio-data:
  gitea-data:
  gitea-config:
  sonarqube-data:
  sonarqube-extensions:
  commerce-postgres-data:
  commerce-minio-data:
  rabbitmq-data:
  runner-validation-data:
  runner-validation-docker:
  runner-security-data:
  runner-security-docker:
  runner-build-data:
  runner-build-docker:
  runner-trust-data:
  runner-trust-docker:

services:
  # ---------------------------------------------------------------- core
  postgres:
    image: ${IMAGE_POSTGRES}
    restart: unless-stopped
    mem_limit: 512m
    # Tuned for workstation disks, including slow hard disks: after an unclean stop the data
    # directory is synced with one syncfs call instead of one fsync per file, and commits
    # do not wait for the disk. A crash can lose the last moments of commits but never
    # corrupts the database (see docs/production-considerations.md).
    command: ["postgres", "-c", "recovery_init_sync_method=syncfs", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # Read by the init script to create one database and one owner role per service.
      GITEA_DB_PASSWORD: ${GITEA_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      SONARQUBE_DB_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      CONTROLPLANE_DB_PASSWORD: ${CONTROLPLANE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    # Internal network only: no host port. Use `docker exec` for administration.
    networks:
      data:
        ipv4_address: 172.31.0.10
        aliases: [postgres.sscp.test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

  vault:
    image: ${IMAGE_VAULT}
    restart: unless-stopped
    # Vault itself needs little memory, but its binary is over 500 MB and the limit also
    # covers the cached pages of that binary. Below this, the kernel keeps evicting Vault's
    # code and re-reading it from disk, and Vault stalls whenever the disk is busy.
    mem_limit: 768m
    command: ["server"]
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /etc/sscp/certs/sscp-root-ca.crt
    volumes:
      - vault-data:/vault/file
      - vault-logs:/vault/logs
      - type: bind
        source: ./vault/config
        target: /vault/config
        read_only: true
      - type: bind
        source: ${PKI_DIR}/vault
        target: /vault/tls
        read_only: true
      - *tls-ca
    networks:
      edge:
        ipv4_address: 172.30.0.12
        aliases: [vault.sscp.test]
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      # Healthy means "the API answers", sealed or not; `sscp up` unseals Vault after every
      # restart. The check uses the image's small wget on the loopback address rather than
      # the `vault` CLI: the CLI binary is several hundred MB, larger than this container's
      # memory limit, so every check re-read it from disk, which saturated slow disks.
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate 'https://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200&standbycode=200' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: ${IMAGE_KEYCLOAK}
    restart: unless-stopped
    mem_limit: 1g
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres.sscp.test:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # One fixed public URL, so the token issuer is identical for callers inside the
      # Docker network, inside the cluster and on the host.
      KC_HOSTNAME: https://keycloak.sscp.test:9443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTPS_PORT: "9443"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/tls.key
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65
    volumes:
      - type: bind
        source: ${PKI_DIR}/keycloak
        target: /opt/keycloak/conf/tls
        read_only: true
    networks:
      edge:
        ipv4_address: 172.30.0.13
        aliases: [keycloak.sscp.test]
      data: {}
    ports:
      - "127.0.0.1:9443:9443"
    healthcheck:
      # The image has no curl; bash's /dev/tcp is enough to ask the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    image: ${IMAGE_MINIO}
    restart: unless-stopped
    mem_limit: 512m
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001", "--certs-dir", "/certs"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT: "false"
    volumes:
      - minio-data:/data
      - type: bind
        source: ${PKI_DIR}/minio/tls.crt
        target: /certs/public.crt
        read_only: true
      - type: bind
        source: ${PKI_DIR}/minio/tls.key
        target: /certs/private.key
        read_only: true
      - type: bind
        source: ${PKI_DIR}/ca.crt
        target: /certs/CAs/sscp-root-ca.crt
        read_only: true
    # Raw evidence lives here: only the internal data network, never the edge network,
    # and no host port. Administration goes through short-lived mc containers.
    networks:
      data:
        ipv4_address: 172.31.0.11
        aliases: [minio.sscp.test]

  gitea:
    image: ${IMAGE_GITEA}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres.sscp.test:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__PROTOCOL: https
      GITEA__server__DOMAIN: gitea.sscp.test
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: https://gitea.sscp.test:3000/
      GITEA__server__CERT_FILE: /etc/sscp/tls/tls.crt
      GITEA__server__KEY_FILE: /etc/sscp/tls/tls.key
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__LFS_START_SERVER: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
      GITEA__security__MIN_PASSWORD_LENGTH: "12"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__actions__ENABLED: "true"
      # `uses:` may only resolve actions hosted on this instance; nothing is fetched from
      # github.com, so no third-party action can enter a pipeline unreviewed.
      GITEA__actions__DEFAULT_ACTIONS_URL: self
      # Jobs that no runner accepts (for example an application workflow asking for a
      # platform runner) are cancelled instead of waiting for a day.
      GITEA__actions__ABANDONED_JOB_TIMEOUT: 30m
      # Webhooks may only target platform services.
      GITEA__webhook__ALLOWED_HOST_LIST: "*.sscp.test"
      GITEA__webhook__SKIP_TLS_VERIFY: "false"
      GITEA__metrics__ENABLED: "true"
      GITEA__metrics__TOKEN: ${GITEA_METRICS_TOKEN}
      GITEA__log__LEVEL: Info
      # Go reads extra trust anchors from these directories (outgoing webhooks to the
      # Control Plane are verified against the local CA).
      SSL_CERT_DIR: /etc/ssl/certs:/etc/sscp/certs
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - type: bind
        source: ${PKI_DIR}/gitea
        target: /etc/sscp/tls
        read_only: true
      - *tls-ca
    networks:
      edge:
        ipv4_address: 172.30.0.10
        aliases: [gitea.sscp.test]
      data: {}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------- Security Control Plane
  # Built from this repository and started by `sscp up` after its database role exists and
  # its migrations ran (with the owner role, in a one-off container).
  controlplane:
    image: sscp/controlplane:local
    profiles: [controlplane]
    build:
      context: ..
      dockerfile: platform/controlplane/Dockerfile
      args:
        SDK_IMAGE: ${IMAGE_DOTNET_SDK}
        RUNTIME_IMAGE: ${IMAGE_DOTNET_ASPNET}
    restart: unless-stopped
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Runtime role: row access only, no DELETE anywhere (see ControlPlaneMigrator).
      ConnectionStrings__controlplane: Host=postgres.sscp.test;Database=controlplane;Username=controlplane_app;Password=${CONTROLPLANE_APP_DB_PASSWORD}
      Identity__Issuer: https://keycloak.sscp.test:9443/realms/platform
      Identity__CaCertificatePath: /etc/sscp/certs/sscp-root-ca.crt
      EvidenceStore__Endpoint: https://minio.sscp.test:9000
      EvidenceStore__AccessKey: controlplane
      EvidenceStore__SecretKey: ${MINIO_CONTROLPLANE_SECRET}
      EvidenceStore__CaCertificatePath: /etc/sscp/certs/sscp-root-ca.crt
      # Gitea: workflow dispatch and commit statuses as sscp-controlplane; webhook signature secret.
      Gitea__BaseUrl: https://gitea.sscp.test:3000
      Gitea__Token: ${CONTROLPLANE_GITEA_TOKEN:-}
      Gitea__WebhookSecret: ${CONTROLPLANE_WEBHOOK_SECRET}
      Gitea__CaCertificatePath: /etc/sscp/certs/sscp-root-ca.crt
      # Vault: mints single-use signing grants for approved releases (AppRole bound to this
      # container's address; it cannot sign itself).
      Vault__Address: https://vault.sscp.test:8200
      Vault__RoleId: ${CONTROLPLANE_VAULT_ROLE_ID:-}
      Vault__SecretId: ${CONTROLPLANE_VAULT_SECRET_ID:-}
      Vault__CaCertificatePath: /etc/sscp/certs/sscp-root-ca.crt
      # Argo CD: shared token its notifications controller presents with deployment reports.
      ArgoCd__NotificationToken: ${CONTROLPLANE_ARGOCD_TOKEN:-}
      Kestrel__Endpoints__Api__Url: https://+:8443
      Kestrel__Endpoints__Api__Certificate__Path: /etc/sscp/tls/tls.crt
      Kestrel__Endpoints__Api__Certificate__KeyPath: /etc/sscp/tls/tls.key
      # Health and metrics only; never published on the host.
      Kestrel__Endpoints__Management__Url: http://+:9464
    volumes:
      - type: bind
        source: ${PKI_DIR}/controlplane
        target: /etc/sscp/tls
        read_only: true
      - *tls-ca
    networks:
      edge:
        ipv4_address: 172.30.0.14
        aliases: [controlplane.sscp.test]
      data: {}
    ports:
      - "127.0.0.1:7443:8443"
    healthcheck:
      # The chiseled image has no shell or curl; the application probes itself.
      test: ["CMD", "dotnet", "/app/Sscp.ControlPlane.Api.dll", "healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 30
      start_period: 10s

  # ---------------------------------------------------------------- CI runners (profile ci)
  # One runner per trust zone. Each hosts a private rootless Docker daemon for its jobs
  # (privileged is required to start that nested daemon; jobs themselves are never
  # privileged). Fixed addresses let Vault bind each zone identity to its runner.
  # Configuration comes from .local/generated/runners/<zone>/config.yaml (written by sscp).
  runner-validation:
    <<: &runner
      image: ${IMAGE_GITEA_RUNNER}
      profiles: [ci]
      restart: unless-stopped
      privileged: true
      depends_on:
        gitea:
          condition: service_healthy
    mem_limit: 4g
    environment:
      <<: &runner-env
        GITEA_INSTANCE_URL: https://gitea.sscp.test:3000
        CONFIG_FILE: /config/config.yaml
        # Go reads trust anchors from these directories: public roots plus the local CA.
        # Both the runner and the nested Docker daemon (pulling from Harbor) inherit it.
        SSL_CERT_DIR: /etc/ssl/certs:/etc/sscp/certs
      GITEA_RUNNER_NAME: sscp-validation
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN_VALIDATION:-}
    volumes:
      - runner-validation-data:/data
      - runner-validation-docker:/home/rootless/.local/share/docker
      - { type: bind, source: "${GENERATED_DIR}/runners/validation/config.yaml", target: /config/config.yaml, read_only: true }
      - &runner-ca { type: bind, source: "${PKI_DIR}/ca.crt", target: /etc/sscp/certs/sscp-root-ca.crt, read_only: true }
      - &runner-docker-run { type: bind, source: ./runner/docker-run, target: /etc/s6/docker/run, read_only: true }
    networks:
      edge: { ipv4_address: 172.30.0.21 }

  runner-security:
    <<: *runner
    mem_limit: 7g   # also hosts the security-test environment during dynamic testing
    environment:
      <<: *runner-env
      GITEA_RUNNER_NAME: sscp-security
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN_SECURITY:-}
    volumes:
      - runner-security-data:/data
      - runner-security-docker:/home/rootless/.local/share/docker
      - { type: bind, source: "${GENERATED_DIR}/runners/security/config.yaml", target: /config/config.yaml, read_only: true }
      - *runner-ca
      - *runner-docker-run
    networks:
      edge: { ipv4_address: 172.30.0.22 }

  runner-build:
    <<: *runner
    mem_limit: 4g
    environment:
      <<: *runner-env
      GITEA_RUNNER_NAME: sscp-build
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN_BUILD:-}
    volumes:
      - runner-build-data:/data
      - runner-build-docker:/home/rootless/.local/share/docker
      - { type: bind, source: "${GENERATED_DIR}/runners/build/config.yaml", target: /config/config.yaml, read_only: true }
      - *runner-ca
      - *runner-docker-run
    networks:
      edge: { ipv4_address: 172.30.0.23 }

  runner-trust:
    <<: *runner
    mem_limit: 1g
    environment:
      <<: *runner-env
      GITEA_RUNNER_NAME: sscp-trust
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN_TRUST:-}
    volumes:
      - runner-trust-data:/data
      - runner-trust-docker:/home/rootless/.local/share/docker
      - { type: bind, source: "${GENERATED_DIR}/runners/trust/config.yaml", target: /config/config.yaml, read_only: true }
      - *runner-ca
      - *runner-docker-run
    networks:
      edge: { ipv4_address: 172.30.0.24 }

  # ---------------------------------------------------------------- quality (on demand)
  sonarqube:
    image: ${IMAGE_SONARQUBE}
    profiles: [quality]
    restart: unless-stopped
    mem_limit: 2560m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres.sscp.test:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      SONAR_WEB_JAVAADDITIONALOPTS: -Xmx512m
      SONAR_CE_JAVAADDITIONALOPTS: -Xmx768m
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Xms512m -Xmx512m
      # Docker Desktop's VM does not always allow raising vm.max_map_count.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_TELEMETRY_ENABLE: "false"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
    networks:
      edge:
        ipv4_address: 172.30.0.15
        aliases: [sonarqube.sscp.test]
      data: {}
    ports:
      - "127.0.0.1:9100:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # ---------------------------------------------------------------- workload (on demand)
  # Data services for running the commerce workload on the host during development.
  # In the cluster the workload uses its own instances in the commerce-data namespace.
  commerce-postgres:
    image: ${IMAGE_POSTGRES}
    profiles: [workload]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COMMERCE_DEV_POSTGRES_PASSWORD}
      POSTGRES_DB: commerce
    volumes:
      - commerce-postgres-data:/var/lib/postgresql
    networks: [workload]
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: ${IMAGE_REDIS}
    profiles: [workload]
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--requirepass", "${REDIS_DEV_PASSWORD}", "--appendonly", "no"]
    networks: [workload]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_DEV_PASSWORD}

  rabbitmq:
    image: ${IMAGE_RABBITMQ}
    profiles: [workload]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: commerce
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEV_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: commerce
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [workload]
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 30

  commerce-minio:
    image: ${IMAGE_MINIO}
    profiles: [workload]
    restart: unless-stopped
    mem_limit: 256m
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: commerce-admin
      MINIO_ROOT_PASSWORD: ${COMMERCE_DEV_MINIO_PASSWORD}
    volumes:
      - commerce-minio-data:/data
    networks: [workload]
    ports:
      - "127.0.0.1:9010:9000"
