# Desired state of the source-control system: people, machine identities, organisations,
# teams, repositories and their protections. `sscp up` makes Gitea match this file.
#
# Structure only. Passwords and tokens are generated by `sscp` and kept in .local/secrets.

users:
  # People
  alice: { fullName: Alice Developer, description: commerce developer (feature branches and pull requests) }
  max: { fullName: Max Maintainer, description: commerce maintainer (reviews and approves pull requests) }
  rhea: { fullName: Rhea Release, description: release manager (creates protected v* tags) }
  pat: { fullName: Pat Platform, description: platform engineer (owns the platform repositories) }
  omar: { fullName: Omar Operations, description: platform reviewer (approves GitOps pull requests) }
  # Machine identities
  sscp-controlplane: { fullName: Security Control Plane, machine: true, description: dispatches platform workflows and sets commit statuses }
  sscp-source-reader: { fullName: CI source reader, machine: true, description: read-only source access for the security and build zones }
  sscp-gitops-bot: { fullName: GitOps release bot, machine: true, description: commits release digests to commerce-gitops (trust zone, signing grant only) }
  sscp-argocd: { fullName: Argo CD, machine: true, description: read-only access to the repositories Argo CD deploys from }

organisations:
  commerce:
    description: The commerce product team
    repositories:
      commerce-app:
        source: commerce-app            # workspace directory published as the first commit
        actions: true                   # the validation workflow runs here
        protectedBranches:
          main:
            # Nobody pushes to main; changes arrive through reviewed pull requests.
            push: false
            requiredApprovals: 1
            approvers: [maintainers]
            dismissStaleApprovals: true
            blockOnRejectedReviews: true
            blockAdminMergeOverride: true
            # Globs: Gitea Actions names its statuses "<workflow> / <job> (<event>)".
            statusChecks: ["validation / *", "sscp/source-security"]
        protectedTags:
          "v*": { teams: [release-managers] }
        webhook: controlplane
    teams:
      developers: { permission: write, members: [alice], repositories: [commerce-app] }
      maintainers: { permission: write, members: [max], repositories: [commerce-app] }
      release-managers: { permission: write, members: [rhea], repositories: [commerce-app] }
      source-readers: { permission: read, members: [sscp-source-reader], repositories: [commerce-app] }
      # Commit statuses need write access to code in Gitea. Branch protection keeps this
      # identity from changing main: it is not an approver and cannot push there.
      status-reporters: { permission: write, members: [sscp-controlplane], repositories: [commerce-app] }

  platform:
    description: The platform team (supply-chain security, GitOps)
    repositories:
      supply-chain-platform:
        source: supply-chain-platform
        actions: true                   # security, build and trust pipelines run here
        protectedBranches:
          main:
            push: true
            pushTeams: [platform-engineers]
            blockAdminMergeOverride: true
      commerce-gitops:
        source: commerce-gitops
        protectedBranches:
          main:
            # Only the release bot pushes directly (new digests after a signed release).
            # People change desired state through reviewed pull requests that pass the
            # Control Plane's deployment-security check.
            push: true
            pushTeams: [gitops-writers]
            requiredApprovals: 1
            approvers: [platform-engineers, gitops-reviewers]
            dismissStaleApprovals: true
            blockOnRejectedReviews: true
            blockAdminMergeOverride: true
            statusChecks: ["sscp/deployment-security"]
        webhook: controlplane
    teams:
      platform-engineers: { permission: write, members: [pat], repositories: [supply-chain-platform, commerce-gitops] }
      gitops-writers: { permission: write, members: [sscp-gitops-bot], repositories: [commerce-gitops] }
      # Reviews GitOps pull requests; not allowed to push to main (see gitops-writers).
      gitops-reviewers: { permission: write, members: [omar], repositories: [commerce-gitops] }
      # Argo CD reads the cluster security state and the desired workload state.
      deployment-readers: { permission: read, members: [sscp-argocd], repositories: [supply-chain-platform, commerce-gitops] }
      # The security zone fetches GitOps pull requests to scan the rendered manifests.
      source-readers: { permission: read, members: [sscp-source-reader], repositories: [commerce-gitops] }
      # Sets `sscp/deployment-security`; branch protection keeps it from changing main.
      status-reporters: { permission: write, members: [sscp-controlplane], repositories: [commerce-gitops] }
      # Workflow dispatch only: read code, write Actions (to start runs), nothing else.
      pipeline-dispatch:
        permission: read
        units: { repo.code: read, repo.actions: write }
        members: [sscp-controlplane]
        repositories: [supply-chain-platform]
