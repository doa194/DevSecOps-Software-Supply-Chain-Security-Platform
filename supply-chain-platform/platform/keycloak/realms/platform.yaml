# Keycloak realm for the supply-chain platform itself (the Security Control Plane API).
#
# Structure only: roles, clients and test personas. Client secrets and passwords are
# generated by `sscp` and kept out of the repositories.
realm: platform
displayName: Supply Chain Platform
settings:
  accessTokenLifespan: 300
  ssoSessionIdleTimeout: 1800
  bruteForceProtected: true
  failureFactor: 5
  permanentLockout: false
  sslRequired: all
  registrationAllowed: false
  resetPasswordAllowed: false

roles:
  platform-viewer: Reads builds, evidence, decisions, releases and the audit log
  risk-owner: Requests time-limited risk exceptions for findings they own
  security-approver: Approves, rejects and revokes risk exceptions requested by others
  platform-admin: Administers the platform
  # Zone roles. The Control Plane accepts a zone role only in a token of the client with
  # the same name, so these roles are useless on a person's account.
  ci-security-zone: Security zone pipelines (scanners)
  ci-build-zone: Build zone pipelines (image build, SBOM)
  ci-trust-zone: Trust zone pipelines (release evaluation, signing, promotion)
  cluster-reporter: In-cluster reporter (deployment status, cluster scans)

clients:
  # Audience of every token the Control Plane accepts.
  controlplane-api:
    public: false
    bearerOnly: true
  # Public client for people using the `sscp` CLI and for automated tests (password grant;
  # a local-testing simplification, a browser UI would use authorization code with PKCE).
  sscp-cli:
    public: true
    directAccessGrants: true
    audience: controlplane-api
  # One confidential client per CI trust zone (client-credentials grant). Their secrets are
  # delivered to the zone's runner only.
  ci-security-zone:
    public: false
    serviceAccount: true
    audience: controlplane-api
    serviceAccountRealmRoles: [ci-security-zone]
  ci-build-zone:
    public: false
    serviceAccount: true
    audience: controlplane-api
    serviceAccountRealmRoles: [ci-build-zone]
  ci-trust-zone:
    public: false
    serviceAccount: true
    audience: controlplane-api
    serviceAccountRealmRoles: [ci-trust-zone]
  cluster-reporter:
    public: false
    serviceAccount: true
    audience: controlplane-api
    serviceAccountRealmRoles: [cluster-reporter]

personas:
  rita: { roles: [risk-owner, platform-viewer], firstName: Rita, lastName: RiskOwner }
  sean: { roles: [security-approver, risk-owner, platform-viewer], firstName: Sean, lastName: Security }
  victor: { roles: [platform-viewer], firstName: Victor, lastName: Viewer }
  paula: { roles: [platform-admin, platform-viewer], firstName: Paula, lastName: Platform }
