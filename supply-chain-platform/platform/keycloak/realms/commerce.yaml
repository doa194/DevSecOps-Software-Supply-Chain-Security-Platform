# Keycloak realm for the commerce workload.
#
# This file describes structure only: roles, clients and test personas. It never contains
# secrets. Client secrets and user passwords are generated by `sscp` at bootstrap time and
# stored in .local/secrets (and, for workloads, in Vault).
realm: commerce
displayName: Commerce
settings:
  # Access tokens are short-lived; there are no long-lived bearer credentials.
  accessTokenLifespan: 300
  ssoSessionIdleTimeout: 1800
  bruteForceProtected: true
  failureFactor: 5
  permanentLockout: false
  sslRequired: all
  registrationAllowed: false
  resetPasswordAllowed: false
  loginWithEmailAllowed: true

roles:
  customer: Places and follows their own orders
  support-agent: Helps customers; sees masked personal data
  catalog-manager: Maintains products and prices
  inventory-clerk: Records goods received and watches stock
  order-manager: Manages and fulfils orders
  finance: Views payments and issues refunds
  auditor: Reads the audit trail
  admin: Administers roles and feature flags

clients:
  # Audience of every token accepted by the gateway, the API and the workers.
  commerce-api:
    public: false
    bearerOnly: true
  # Public client used by automated tests and DAST to obtain user tokens with the
  # password grant. A local-testing simplification; browsers would use the
  # authorization code flow with PKCE.
  commerce-cli:
    public: true
    directAccessGrants: true
    standardFlow: false
    audience: commerce-api
  # Public client used only by the dynamic security scan (ZAP) in the security zone. Its
  # tokens live 30 minutes, so a scan does not lose authentication part-way through.
  commerce-dast:
    public: true
    directAccessGrants: true
    standardFlow: false
    audience: commerce-api
    accessTokenLifespan: 1800
  # Service account the Identity module uses to manage realm roles.
  commerce-identity-admin:
    public: false
    serviceAccount: true
    realmManagementRoles: [view-users, query-users, manage-users]

personas:
  carol: { roles: [customer], firstName: Carol, lastName: Customer }
  dave: { roles: [customer], firstName: Dave, lastName: Customer }
  sam: { roles: [support-agent], firstName: Sam, lastName: Support }
  cathy: { roles: [catalog-manager], firstName: Cathy, lastName: Catalog }
  ivan: { roles: [inventory-clerk], firstName: Ivan, lastName: Inventory }
  olga: { roles: [order-manager], firstName: Olga, lastName: Orders }
  fiona: { roles: [finance], firstName: Fiona, lastName: Finance }
  aldo: { roles: [auditor], firstName: Aldo, lastName: Auditor }
  ada: { roles: [admin], firstName: Ada, lastName: Admin }
