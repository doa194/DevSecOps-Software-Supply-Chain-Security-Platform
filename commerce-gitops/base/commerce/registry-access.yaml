# Pull-only credentials for the trusted project (robot `cluster-puller`), from Vault.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ .registry }}":{"auth":"{{ printf "%s:%s"
          .username .password | b64enc }}"}}}'
  dataFrom:
  - extract:
      key: platform/cluster/harbor-pull
