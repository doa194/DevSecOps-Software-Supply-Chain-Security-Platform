# Schema migrations with the schema-owner database role. The owner credentials exist only
# in this Job's secret; the running services use per-module roles without DDL rights.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-migrations
  namespace: commerce
  labels:
    app.kubernetes.io/part-of: commerce
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: commerce-migrations
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: workload/commerce/commerce-migrations
---
apiVersion: batch/v1
kind: Job
metadata:
  name: commerce-migrations
  namespace: commerce
  labels:
    app.kubernetes.io/name: commerce-migrations
    app.kubernetes.io/part-of: commerce
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commerce-migrations
        app.kubernetes.io/part-of: commerce
    spec:
      restartPolicy: Never
      serviceAccountName: commerce-migrations
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: commerce-api
        image: commerce-api
        args:
        - migrate
        envFrom:
        - configMapRef:
            name: commerce-config
        - configMapRef:
            name: commerce-messaging
        - secretRef:
            name: commerce-api
        - secretRef:
            name: commerce-migrations
        env:
        - name: Messaging__Source
          value: commerce-api
        - name: Messaging__Signing__KeyId
          value: commerce-api-key
        - name: RELEASE_TAG
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: tag
        - name: RELEASE_COMMIT
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: commit
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: sscp.release.tag=$(RELEASE_TAG),sscp.release.commit=$(RELEASE_COMMIT),k8s.container.name=commerce-api
        securityContext: &id001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        volumeMounts: &id002
        - name: tmp
          mountPath: /tmp
        - name: sscp-root-ca
          mountPath: /etc/sscp
          readOnly: true
      - name: audit-worker
        image: audit-worker
        args:
        - migrate
        envFrom:
        - configMapRef:
            name: commerce-config
        - configMapRef:
            name: commerce-messaging
        - secretRef:
            name: audit-worker
        - secretRef:
            name: commerce-migrations
        env:
        - name: Messaging__Source
          value: audit-worker
        - name: RELEASE_TAG
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: tag
        - name: RELEASE_COMMIT
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: commit
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: sscp.release.tag=$(RELEASE_TAG),sscp.release.commit=$(RELEASE_COMMIT),k8s.container.name=audit-worker
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        volumeMounts: *id002
      - name: reporting-worker
        image: reporting-worker
        args:
        - migrate
        envFrom:
        - configMapRef:
            name: commerce-config
        - configMapRef:
            name: commerce-messaging
        - secretRef:
            name: reporting-worker
        - secretRef:
            name: commerce-migrations
        env:
        - name: Messaging__Source
          value: reporting-worker
        - name: RELEASE_TAG
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: tag
        - name: RELEASE_COMMIT
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: commit
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: sscp.release.tag=$(RELEASE_TAG),sscp.release.commit=$(RELEASE_COMMIT),k8s.container.name=reporting-worker
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        volumeMounts: *id002
      - name: notification-worker
        image: notification-worker
        args:
        - migrate
        envFrom:
        - configMapRef:
            name: commerce-config
        - configMapRef:
            name: commerce-messaging
        - secretRef:
            name: notification-worker
        - secretRef:
            name: commerce-migrations
        env:
        - name: Messaging__Source
          value: notification-worker
        - name: RELEASE_TAG
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: tag
        - name: RELEASE_COMMIT
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: commit
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: sscp.release.tag=$(RELEASE_TAG),sscp.release.commit=$(RELEASE_COMMIT),k8s.container.name=notification-worker
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        volumeMounts: *id002
      containers:
      - name: document-worker
        image: document-worker
        args:
        - migrate
        envFrom:
        - configMapRef:
            name: commerce-config
        - configMapRef:
            name: commerce-messaging
        - secretRef:
            name: document-worker
        - secretRef:
            name: commerce-migrations
        env:
        - name: Messaging__Source
          value: document-worker
        - name: Messaging__Signing__KeyId
          value: document-worker-key
        - name: RELEASE_TAG
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: tag
        - name: RELEASE_COMMIT
          valueFrom:
            configMapKeyRef:
              name: commerce-release
              key: commit
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: sscp.release.tag=$(RELEASE_TAG),sscp.release.commit=$(RELEASE_COMMIT),k8s.container.name=document-worker
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
        volumeMounts: *id002
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: sscp-root-ca
        configMap:
          name: sscp-root-ca
