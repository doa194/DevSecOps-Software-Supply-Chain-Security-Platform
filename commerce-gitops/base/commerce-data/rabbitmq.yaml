# RabbitMQ: the integration-event broker. Messages are signed by their publishers, so the
# broker itself is not trusted with message integrity. The broker keeps its data in an
# ephemeral volume in this local setup: messages still queued when the pod restarts are lost.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq
  namespace: commerce-data
  labels:
    app.kubernetes.io/part-of: commerce
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: rabbitmq
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: workload/commerce-data/rabbitmq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: commerce-data
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: commerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: commerce
    spec:
      serviceAccountName: rabbitmq
      automountServiceAccountToken: false
      hostname: rabbitmq
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: harbor.sscp.test:8443/platform-tools/rabbitmq@sha256:6e9170da4bede69ad91a132027aa0a186f2d0d050f1c0fd222e3a5511600c567
          env:
            - name: RABBITMQ_DEFAULT_VHOST
              value: commerce
          envFrom:
            - secretRef:
                name: rabbitmq
          ports:
            - name: amqp
              containerPort: 5672
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_port_connectivity]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, status]
            periodSeconds: 30
            timeoutSeconds: 15
            initialDelaySeconds: 60
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: commerce-data
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: commerce
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
