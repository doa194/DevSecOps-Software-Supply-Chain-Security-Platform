# Redis: the commerce API's cache and rate-limit store. Nothing in it needs to survive a
# restart, so it keeps no persistent volume.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis
  namespace: commerce-data
  labels:
    app.kubernetes.io/part-of: commerce
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: redis
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: workload/commerce-data/redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: commerce-data
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: commerce
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: harbor.sscp.test:8443/platform-tools/redis@sha256:019e4fb3c6de024c8f70ab5219d4abded5f335de770876981c7b0a051c43df87
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]
          envFrom:
            - secretRef:
                name: redis
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: commerce-data
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: commerce
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
